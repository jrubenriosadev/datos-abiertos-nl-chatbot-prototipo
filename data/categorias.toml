# ==========================================================
# Categorías del portal. Una categoría sin datasets (subcarpetas con CSV
# y dataset.toml) se muestra automáticamente como "próximamente".
# Las palabras clave sirven para reconocer preguntas de cada categoría.
# Se comparan sin acentos y en minúsculas.
# ==========================================================

